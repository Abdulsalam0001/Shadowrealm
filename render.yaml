services:
  - type: web
    name: shadowrealm-store
    runtime: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: CUSTOMER_SESSION_SECRET
        sync: false
      - key: BTC_NGN_RATE
        sync: false
      - key: BTC_USD_RATE
        sync: false
      - key: ETH_NGN_RATE
        sync: false
      - key: ETH_RPC_URL
        sync: false
      - key: BTC_RECEIVING_ADDRESS
        value: bc1qzwsza9hzcaa36avgv5qu6kts4k52wvx2m4cpgv
      - key: ETH_RECEIVING_ADDRESS
        value: 0x2bAE0972099c92463ec38A1bC11b8856892388eC
      - key: BTC_REQUIRED_CONFIRMATIONS
        value: "2"
      - key: ETH_REQUIRED_CONFIRMATIONS
        value: "12"
      - key: FULFILLMENT_WEBHOOK_URL
        sync: false
      - key: FULFILLMENT_WEBHOOK_SECRET
        sync: false
